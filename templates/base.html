<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BrainCel{% endblock %}</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#6c5ce7">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --purple-dark: #2c1e4a;
            --purple-main: #6c5ce7;
            --purple-soft: #a88beb;
            --blue-soft: #74b9ff;
            --blue-light: #e0f7fa;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #2d3436;
        }

        body {
            background: linear-gradient(135deg, var(--purple-dark), #1e1b4b, #0f172a);
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .cozy-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.25);
            width: 100%;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .organic-blob {
            position: absolute;
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, var(--purple-soft), var(--blue-soft));
            opacity: 0.3;
            filter: blur(45px);
            border-radius: 50%;
            z-index: 0;
        }

        .blob-1 { top: -50px; right: -50px; }
        .blob-2 { bottom: -50px; left: -50px; }

        .card-content {
            position: relative;
            z-index: 1;
        }

        .brand-title {
            font-weight: 700;
            background: linear-gradient(45deg, var(--purple-main), #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .custom-input {
            border-radius: 16px;
            padding: 12px 18px;
            border: 1.5px solid #e2e8f0;
            background: #f8fafc;
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            border-color: var(--purple-main);
            box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.15);
            background: #ffffff;
        }

        .btn-cozy {
            background: linear-gradient(135deg, var(--purple-main), #3b82f6);
            color: #fff;
            border: none;
            border-radius: 18px;
            padding: 12px 24px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .btn-cozy:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.4);
            color: #fff;
        }

        .password-toggle-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            z-index: 10;
        }

        .password-toggle-btn:hover {
            color: var(--purple-main);
        }

        .cozy-link {
            color: var(--purple-main);
            text-decoration: none;
            font-weight: 600;
        }

        .cozy-link:hover {
            text-decoration: underline;
        }

        .nav-pills .nav-link.active {
            background-color: var(--purple-main) !important;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
        }

        .nav-pills .nav-link {
            color: var(--text-dark);
        }

        /* Offline Banner Styling */
        #offlineBanner {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: none;
            width: 90%;
            max-width: 420px;
        }
    </style>
</head>
<body>
    <!-- Offline Alert Banner -->
    <div id="offlineBanner" class="alert alert-warning text-center shadow-lg rounded-4 py-2 border-0 fw-semibold small">
        <i class="bi bi-wifi-off me-2"></i>You are currently offline. Basic functionality remains available.
    </div>

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword(fieldId, iconId) {
            const field = document.getElementById(fieldId);
            const icon = document.getElementById(iconId);
            if (field.type === 'password') {
                field.type = 'text';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            } else {
                field.type = 'password';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            }
        }

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/serviceworker.js')
                    .then(reg => console.log('Service Worker Registered:', reg.scope))
                    .catch(err => console.error('Service Worker Registration Failed:', err));
            });
        }

        // Offline Detection Logic
        function updateOnlineStatus() {
            const banner = document.getElementById('offlineBanner');
            if (!navigator.onLine) {
                banner.style.display = 'block';
            } else {
                banner.style.display = 'none';
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        document.addEventListener('DOMContentLoaded', updateOnlineStatus);
    </script>
</body>
</html>
