<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}BrainCel{% endblock %}</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#6c5ce7">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Instant Dark Mode Check (Prevents white flash on load) -->
    <script>
        const savedTheme = localStorage.getItem('braincel-theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <style>
        /* LIGHT MODE (Default Variables) */
        :root {
            --purple-dark: #2c1e4a;
            --purple-main: #6c5ce7;
            --purple-soft: #a88beb;
            --blue-soft: #74b9ff;
            --blue-light: #e0f7fa;
            
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #2d3436;
            --text-muted-custom: #6c757d;
            --mobile-bg: #ffffff;
            --chat-bg: #f8f9fc;
            --msg-bg: #ffffff;
            --input-bg: #f8fafc;
            --weather-bg: linear-gradient(to bottom right, #ffffff, #f0f3ff);
            --border-color: rgba(108, 92, 231, 0.1);
        }

        /* DARK MODE OVERRIDES */
        [data-theme="dark"] {
            --card-bg: rgba(30, 30, 46, 0.95);
            --text-dark: #e2e8f0;
            --text-muted-custom: #94a3b8;
            --mobile-bg: #12121c; /* Very dark blue/black for mobile edge */
            --chat-bg: #1e1e2e;
            --msg-bg: #2b2b40;
            --input-bg: #2b2b40;
            --weather-bg: linear-gradient(to bottom right, #1e1e2e, #2b2b40);
            --border-color: rgba(255, 255, 255, 0.05);
        }

        /* DESKTOP VIEW (Floating 540px Card) */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--purple-dark), #1e1b4b, #0f172a);
            height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
        }

        .cozy-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 540px; 
            height: 90vh; 
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column; 
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Component Styles */
        .organic-blob {
            position: absolute; width: 200px; height: 200px;
            background: linear-gradient(135deg, var(--purple-soft), var(--blue-soft));
            opacity: 0.3; filter: blur(45px); border-radius: 50%; z-index: 0;
        }
        .blob-1 { top: -50px; right: -50px; }
        .blob-2 { bottom: -50px; left: -50px; }
        
        .card-content { position: relative; z-index: 1; flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        .brand-title { font-weight: 700; background: linear-gradient(45deg, var(--purple-main), #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .custom-input { border-radius: 16px; padding: 12px 18px; border: 1.5px solid var(--border-color); background: var(--input-bg); color: var(--text-dark); transition: all 0.3s ease; }
        .custom-input:focus { border-color: var(--purple-main); box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.15); background: var(--card-bg); color: var(--text-dark); }
        .custom-input::placeholder { color: var(--text-muted-custom); }
        
        .btn-cozy { background: linear-gradient(135deg, var(--purple-main), #3b82f6); color: #fff; border: none; border-radius: 18px; padding: 12px 24px; font-weight: 600; transition: transform 0.2s, box-shadow 0.2s; width: 100%; }
        .btn-cozy:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(108, 92, 231, 0.4); color: #fff; }
        
        .nav-pills .nav-link.active { background-color: var(--purple-main) !important; color: #ffffff !important; box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3); }
        .nav-pills .nav-link { color: var(--text-dark); }
        
        #offlineBanner { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 9999; display: none; width: 90%; max-width: 420px; }

        /* General dark mode text utility override */
        .text-dark { color: var(--text-dark) !important; }
        .text-muted { color: var(--text-muted-custom) !important; }

        /* MOBILE VIEW (Edge-to-Edge ChatGPT Style) */
        @media (max-width: 768px) {
            body {
                background: var(--mobile-bg); /* Now switches between white and dark blue */
                display: block;
                height: 100%;
                overflow: hidden;
            }
            .cozy-card {
                max-width: 100% !important;
                height: 100vh !important;
                border-radius: 0 !important;
                border: none !important;
                box-shadow: none !important;
                padding: 0.75rem 0.75rem calc(env(safe-area-inset-bottom, 20px) + 40px) 0.75rem !important;
                margin: 0 !important;
            }
            .organic-blob {
                display: none;
            }
        }

        /* SCROLLING FIX FOR CHAT WINDOW */
        #appTabsContent {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .tab-pane.active {
            display: flex !important;
            flex-direction: column;
            flex-grow: 1;
            min-height: 0;
            overflow: hidden;
        }

        #chatWindow {
            flex-grow: 1;
            overflow-y: auto !important;
            min-height: 0 !important;
            padding-bottom: 15px;
        }
    </style>
</head>
<body>
    <div id="offlineBanner" class="alert alert-warning text-center shadow-lg rounded-4 py-2 border-0 fw-semibold small">
        <i class="bi bi-wifi-off me-2"></i>You are currently offline. Basic functionality remains available.
    </div>

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword(fieldId, iconId) {
            const field = document.getElementById(fieldId);
            const icon = document.getElementById(iconId);
            if (field.type === 'password') {
                field.type = 'text';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            } else {
                field.type = 'password';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/serviceworker.js')
                    .then(reg => console.log('Service Worker Registered:', reg.scope))
                    .catch(err => console.error('Service Worker Registration Failed:', err));
            });
        }

        function updateOnlineStatus() {
            const banner = document.getElementById('offlineBanner');
            if (!navigator.onLine) {
                banner.style.display = 'block';
            } else {
                banner.style.display = 'none';
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        document.addEventListener('DOMContentLoaded', updateOnlineStatus);
    </script>
</body>
</html>
